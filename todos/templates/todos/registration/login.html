<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login - To-Do List</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; 
        }
        .container {
            background: white; padding: 2rem; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%;
        }
        h2 { color: #ff6b6b; margin-top: 0; }
        form { display: flex; flex-direction: column; gap: 1rem; text-align: left; }
        input { padding: 0.8rem; border: 2px solid #ddd; border-radius: 10px; outline: none; }
        input:focus { border-color: #ff6b6b; }
        button { 
            padding: 1rem; background: #ff6b6b; color: white; border: none; 
            border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1rem;
        }
        button:hover { background: #ff5252; transform: scale(1.02); }
        .links { margin-top: 1rem; font-size: 0.9rem; }
        a { color: #ff6b6b; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👋 Welcome Back!</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <div class="links">
            <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
            <p><a href="/">← Back to Home</a></p>
        </div>
    </div>
</body>
</html>
